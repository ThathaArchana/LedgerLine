# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: ledgerline-db
    databaseName: ledgerline
    user: ledgerline
    region: singapore
    plan: free

services:
  # Spring Boot API (Docker Web Service)
  - type: web
    name: ledgerline-api
    runtime: docker
    rootDir: backend
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: ledgerline-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ledgerline-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REDIS_ENABLED
        value: "false"

  # React + Vite SPA (Static Site)
  - type: web
    name: ledgerline-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: ledgerline-api
          envVarKey: RENDER_EXTERNAL_URL

spring.application.name=ledgerline-api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:ledgerline;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

spring.jpa.database-platform=${DB_DIALECT:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

ledgerline.jwt.secret=${JWT_SECRET:local-only-change-this-secret-before-deploying-123456}
ledgerline.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
ledgerline.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
ledgerline.admin.email=${ADMIN_EMAIL:}
ledgerline.admin.password=${ADMIN_PASSWORD:}
ledgerline.frontend.url=${FRONTEND_URL:http://localhost:5173}
ledgerline.mail.from=${SMTP_FROM:}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

ledgerline.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.repositories.enabled=false